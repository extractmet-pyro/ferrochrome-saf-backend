components:
  schemas:
    ActionIn:
      properties:
        action:
          type: string
          enum:
          - set_tap
          - set_resistance
          - set_recipe
          - set_tap_interval
          - disturb
          - tap_now
          title: Action
        params:
          additionalProperties: true
          type: object
          title: Params
        reason:
          type: string
          maxLength: 300
          title: Reason
          default: what-if
      type: object
      required:
      - action
      title: ActionIn
    ActivateIn:
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 5
          title: Reason
          description: change-management justification (audited)
      type: object
      required:
      - reason
      title: ActivateIn
    AssayIn:
      properties:
        assay_wt_pct_dry:
          additionalProperties:
            type: number
          type: object
          title: Assay Wt Pct Dry
          description: dry-basis wt% (must total 100 +/- 2); explicit speciation
        moisture_wet_wt_pct:
          type: number
          maximum: 40.0
          minimum: 0.0
          title: Moisture Wet Wt Pct
          description: free moisture, wt% of wet (as-received) mass
          default: 0.0
        basis:
          type: string
          title: Basis
          description: only 'wt_pct' accepted; mass fractions are rejected
          default: wt_pct
      type: object
      required:
      - assay_wt_pct_dry
      title: AssayIn
    BalanceIn:
      properties:
        recipe:
          $ref: '#/components/schemas/Recipe'
        conditions:
          additionalProperties:
            type: number
          type: object
          title: Conditions
          description: T_metal_K, T_slag_K, T_gas_K, T_feed_K, heat_loss_MW, ...
        prices:
          additionalProperties:
            type: number
          type: object
          title: Prices
      type: object
      required:
      - recipe
      title: BalanceIn
    Body_telemetry_import:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_telemetry_import
    CompareIn:
      properties:
        scenario:
          type: string
          pattern: ^[A-L]$
          title: Scenario
          default: D
        hours:
          type: number
          maximum: 48.0
          exclusiveMinimum: 1.0
          title: Hours
          default: 12.0
        hybrid:
          type: boolean
          title: Hybrid
          default: true
      type: object
      title: CompareIn
    DecisionIn:
      properties:
        decision:
          type: string
          enum:
          - accept
          - reject
          title: Decision
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
          description: operator reason (mandatory, audited)
      type: object
      required:
      - decision
      - reason
      title: DecisionIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          title: Status
        advisory_only:
          type: boolean
          title: Advisory Only
          default: true
      type: object
      required:
      - status
      title: Health
    LoginIn:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginIn
    OptimiseIn:
      properties:
        base_recipe:
          $ref: '#/components/schemas/Recipe'
        ores:
          items:
            type: string
          type: array
          title: Ores
          default:
          - ORE_A_LUMPY
          - ORE_B_PELLET
          - ORE_C_FRIABLE
        reductants:
          items:
            type: string
          type: array
          title: Reductants
          default:
          - COKE_MET
          - COAL_LA
        fluxes:
          items:
            type: string
          type: array
          title: Fluxes
          default:
          - QUARTZITE
          - LIMESTONE
        constraints:
          additionalProperties:
            type: number
          type: object
          title: Constraints
        prices:
          additionalProperties:
            type: number
          type: object
          title: Prices
        conditions:
          additionalProperties:
            type: number
          type: object
          title: Conditions
        bounds:
          additionalProperties:
            items:
              type: number
            type: array
          type: object
          title: Bounds
          description: var -> [lo, hi]; ores as blend fraction, others kg/t ore
      type: object
      required:
      - base_recipe
      title: OptimiseIn
    PlantUpdate:
      properties:
        changes:
          additionalProperties: true
          type: object
          title: Changes
          description: parameter name -> new value (units as listed in GET /config/plant)
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - changes
      - reason
      title: PlantUpdate
    Ready:
      properties:
        ready:
          type: boolean
          title: Ready
        database:
          type: boolean
          title: Database
        models_active:
          additionalProperties: true
          type: object
          title: Models Active
        warm_start_cached:
          type: boolean
          title: Warm Start Cached
      type: object
      required:
      - ready
      - database
      - models_active
      - warm_start_cached
      title: Ready
    Recipe:
      properties:
        ore_blend:
          additionalProperties:
            type: number
          type: object
          title: Ore Blend
          description: ore key -> mass fraction of the ore blend (normalised)
        COKE_MET:
          type: number
          maximum: 400.0
          minimum: 0.0
          title: Coke Met
          description: kg wet per t ore
          default: 172.0
        COAL_LA:
          type: number
          maximum: 300.0
          minimum: 0.0
          title: Coal La
          description: kg wet per t ore
          default: 40.0
        COKE_LOWQ:
          type: number
          maximum: 400.0
          minimum: 0.0
          title: Coke Lowq
          default: 0.0
        QUARTZITE:
          type: number
          maximum: 300.0
          minimum: 0.0
          title: Quartzite
          default: 85.0
        LIMESTONE:
          type: number
          maximum: 200.0
          minimum: 0.0
          title: Limestone
          default: 0.0
        DOLOMITE:
          type: number
          maximum: 200.0
          minimum: 0.0
          title: Dolomite
          default: 0.0
        METAL_RECYCLE:
          type: number
          maximum: 200.0
          minimum: 0.0
          title: Metal Recycle
          default: 0.0
      type: object
      required:
      - ore_blend
      title: Recipe
    RecommendIn:
      properties:
        session_id:
          type: string
          title: Session Id
        hybrid:
          type: boolean
          title: Hybrid
          description: add in-distribution ML residual corrections to SEC / Cr recovery
          default: false
      type: object
      required:
      - session_id
      title: RecommendIn
    ScenarioCompareIn:
      properties:
        scenarios:
          items:
            type: string
          type: array
          maxItems: 12
          minItems: 1
          title: Scenarios
          default:
          - A
          - B
        hours:
          anyOf:
          - type: number
            maximum: 72.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Hours
      type: object
      title: ScenarioCompareIn
    ScenarioSave:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 2
          title: Name
        definition:
          additionalProperties: true
          type: object
          title: Definition
      type: object
      required:
      - name
      - definition
      title: ScenarioSave
    SimCreate:
      properties:
        mva:
          type: number
          maximum: 120.0
          minimum: 3.0
          title: Mva
          description: transformer rating MVA (capacity class)
          default: 45.0
        enclosure:
          type: string
          enum:
          - open
          - semi-closed
          - closed
          title: Enclosure
          default: closed
        scenario:
          type: string
          pattern: ^[A-L]$
          title: Scenario
          default: A
        seed:
          type: integer
          maximum: 2147483648.0
          minimum: 0.0
          title: Seed
          default: 42
        overrides:
          additionalProperties:
            type: number
          type: object
          title: Overrides
          description: geometry overrides, e.g. hearth_inner_diameter_m
        run:
          type: boolean
          title: Run
          description: start real-time-accelerated ticking
          default: true
        speed_steps:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Speed Steps
          description: simulation steps (60 s each) per 0.5 s tick
          default: 2
      type: object
      title: SimCreate
    SpeedIn:
      properties:
        running:
          type: boolean
          title: Running
          default: true
        speed_steps:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Speed Steps
          default: 2
      type: object
      title: SpeedIn
    StepIn:
      properties:
        steps:
          type: integer
          maximum: 720.0
          minimum: 1.0
          title: Steps
          description: number of 60 s steps (max 12 h per call)
          default: 1
      type: object
      title: StepIn
    TagMapIn:
      properties:
        mapping_csv:
          type: string
          title: Mapping Csv
          description: CSV with header site_tag,twin_tag,scale,offset
      type: object
      required:
      - mapping_csv
      title: TagMapIn
    TokenOut:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        role:
          type: string
          title: Role
        username:
          type: string
          title: Username
      type: object
      required:
      - access_token
      - role
      - username
      title: TokenOut
    TrainIn:
      properties:
        target:
          type: string
          enum:
          - sec_residual
          - cr_rec_residual
          - slag_cr2o3_residual
          title: Target
        kind:
          type: string
          enum:
          - ridge
          - gbr
          title: Kind
          default: ridge
        seed:
          type: integer
          minimum: 0.0
          title: Seed
          default: 0
      type: object
      required:
      - target
      title: TrainIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Version:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        api:
          type: string
          title: Api
          default: v1
        synthetic_demo:
          type: boolean
          title: Synthetic Demo
          default: true
      type: object
      required:
      - name
      - version
      title: Version
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
