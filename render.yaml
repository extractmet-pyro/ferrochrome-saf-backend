# Render Blueprint for the BACKEND repository (ferrochrome-saf-backend).
# The frontend lives in its own repository with its own render.yaml (static site).
services:
  - type: web
    name: fecr-twin-api
    runtime: python
    plan: starter            # free plan sleeps: acceptable for demos only, never for plant use
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false            # set a strong value in the dashboard
      - key: ALLOWED_ORIGINS
        sync: false            # https://<your-frontend>.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fecr-twin-db
          property: connectionString
      - key: MODEL_DIR
        value: /var/data/models
      - key: SPINUP_H
        value: "20"
    disk:
      name: fecr-models
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: fecr-twin-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
